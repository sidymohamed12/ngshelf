<header
  class="flex flex-wrap items-center gap-x-ngs-6 gap-y-ngs-2 rounded-[calc(var(--radius-ngs)*1.4)] bg-ngs-surface px-ngs-4 py-ngs-3 shadow-[inset_0_0_0_1px_var(--color-ngs-border)] [&_:is(a,button)]:focus-visible:outline-2 [&_:is(a,button)]:focus-visible:outline-offset-2 [&_:is(a,button)]:focus-visible:outline-ngs-action motion-safe:animate-[ngs-navbar-entree_calc(var(--ngs-duration)*3)_cubic-bezier(.22,1,.36,1)_both] in-[.ngs-sans-animation]:animate-none! in-[.ngs-sans-animation]:[&_*]:animate-none!"
>
  <a class="text-lg font-bold tracking-tight text-inherit no-underline" routerLink="/">{{
    marque()
  }}</a>
  <nav
    class="mr-auto hidden gap-ngs-1 @[40rem]:flex motion-safe:[&>*]:animate-[ngs-navbar-lien_calc(var(--ngs-duration)*3)_cubic-bezier(.22,1,.36,1)_both] [&>*:nth-child(1)]:[animation-delay:120ms] [&>*:nth-child(2)]:[animation-delay:165ms] [&>*:nth-child(3)]:[animation-delay:210ms] [&>*:nth-child(n+4)]:[animation-delay:255ms]"
    aria-label="Navigation principale"
  >
    @for (lien of liens(); track lien.route) {
      <a
        class="inline-flex min-h-11 items-center rounded-ngs px-ngs-3 font-medium text-ngs-text-muted no-underline transition-colors duration-(--ngs-duration) hover:bg-ngs-surface-alt hover:text-ngs-text aria-[current=page]:rounded-none aria-[current=page]:text-ngs-text aria-[current=page]:shadow-[inset_0_-2px_0_var(--color-ngs-action)]"
        [routerLink]="lien.route"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >{{ lien.libelle }}</a
      >
    }
  </nav>
  @if (action()) {
    <a
      class="hidden min-h-11 items-center rounded-ngs bg-ngs-action px-ngs-4 font-semibold text-ngs-on-action no-underline @[40rem]:inline-flex motion-safe:animate-[ngs-navbar-lien_calc(var(--ngs-duration)*3)_cubic-bezier(.22,1,.36,1)_both] motion-safe:[animation-delay:300ms]"
      [routerLink]="routeAction()"
      >{{ action() }}</a
    >
  }
  <button
    class="ml-auto inline-grid size-11 cursor-pointer place-items-center rounded-ngs border-0 bg-ngs-surface-alt text-inherit @[40rem]:hidden [&_svg]:size-[22px]"
    type="button"
    [attr.aria-expanded]="menuOuvert()"
    [attr.aria-controls]="idMenu"
    [attr.aria-label]="libelleMenu()"
    (click)="basculerMenu()"
  >
    <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
      <path
        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"
      />
    </svg>
  </button>
  <nav
    class="flex basis-full flex-col gap-0.5 pt-ngs-2 @[40rem]:hidden motion-safe:[&>*]:animate-[ngs-navbar-lien_calc(var(--ngs-duration)*2)_cubic-bezier(.22,1,.36,1)_both]"
    [id]="idMenu"
    aria-label="Navigation principale"
    [hidden]="!menuOuvert()"
  >
    @for (lien of liens(); track lien.route) {
      <a
        class="inline-flex min-h-11 items-center rounded-ngs px-ngs-3 font-medium text-ngs-text-muted no-underline transition-colors duration-(--ngs-duration) hover:bg-ngs-surface-alt hover:text-ngs-text aria-[current=page]:rounded-none aria-[current=page]:text-ngs-text aria-[current=page]:shadow-[inset_0_-2px_0_var(--color-ngs-action)]"
        [routerLink]="lien.route"
        routerLinkActive
        ariaCurrentWhenActive="page"
        (click)="menuOuvert.set(false)"
      >
        {{ lien.libelle }}
      </a>
    }
  </nav>
</header>
