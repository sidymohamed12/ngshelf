<article
  class="group relative grid overflow-hidden rounded-[calc(var(--radius-ngs)*1.6)] bg-ngs-surface shadow-[inset_0_0_0_1px_var(--color-ngs-border)] hover:shadow-[inset_0_0_0_1px_var(--color-ngs-border),0_12px_24px_-12px_rgb(0_0_0/.3)] motion-safe:transition motion-safe:duration-(--ngs-duration) motion-safe:hover:-translate-y-0.5 has-focus-visible:outline-2 has-focus-visible:outline-offset-3 has-focus-visible:outline-ngs-action in-[.ngs-sans-animation]:translate-none! in-[.ngs-sans-animation]:transition-none!"
>

      [alt]="alt()"
      width="640"
      height="427"
      sizes="22rem"

  <div class="grid gap-ngs-2 p-ngs-4">

        />
      </svg>
      {{ lieu() }}

    <h3 class="m-0 text-lg leading-snug">
      <a
        class="text-inherit no-underline after:absolute after:inset-0 after:rounded-[inherit] after:content-[''] focus-visible:outline-none"
        [routerLink]="lien()"
        >{{ titre() }}</a
      >
    </h3>
    <p class="m-0 text-[15px] text-ngs-text-muted">{{ texte() }}</p>
    @if (prix()) {
      <p class="mt-ngs-1 mb-0 font-semibold tabular-nums text-ngs-action">{{ prix() }}</p>
    }
  </div>
</article>
