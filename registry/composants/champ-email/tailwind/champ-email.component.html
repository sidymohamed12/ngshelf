<div class="grid w-full min-w-[min(14rem,100%)] gap-ngs-2">
  <label class="text-[15px] font-semibold" [for]="id">{{ label() }}</label>
  <input
    class="min-h-ngs-12 w-full rounded-ngs border-[1.5px] border-ngs-border bg-ngs-surface px-ngs-4 text-base text-inherit caret-ngs-action transition-[border-color,box-shadow] duration-(--ngs-duration) placeholder:text-ngs-text-muted focus:border-ngs-action focus:ring-3 focus:ring-ngs-action/20 focus:outline-none aria-invalid:border-ngs-danger aria-invalid:focus:ring-ngs-danger/20"
    type="email"
    autocomplete="email"
    placeholder="awa@exemple.sn"
    [id]="id"
    [value]="valeur()"
    [attr.aria-invalid]="enErreur()"
    [attr.aria-describedby]="id + '-aide ' + id + '-erreur'"
    (input)="saisir($event)"
    (blur)="touche.set(true)"
  />
  @if (aide()) {
    <p class="m-0 text-sm text-ngs-text-muted" [id]="id + '-aide'">{{ aide() }}</p>
  }
  @if (enErreur()) {
    <p
      class="m-0 flex items-start gap-1.5 text-sm font-medium text-ngs-danger [&_svg]:mt-px [&_svg]:size-[18px] [&_svg]:flex-none"
      [id]="id + '-erreur'"
    >
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"
        />
      </svg>
      <span>{{ message() }}</span>
    </p>
  }
</div>
