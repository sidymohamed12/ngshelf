@if (secteurConnu()) {
  <div class="ngs-container grid gap-4 pt-10 pb-8 lg:pt-14">
    <p class="ngs-label ngs-muted m-0 inline-flex items-center gap-2">
      <svg [appIcone]="icone()" taille="sm"></svg>
      <span>{{ textes.secteur }}</span>
    </p>
    <h1 class="ngs-h2 m-0">{{ titre() }}</h1>
    <p class="ngs-lead m-0 max-w-[52ch]">{{ textes.secteurAide }}</p>
  </div>
  <div class="ngs-container pb-24">
    <app-explorateur [portee]="portee()" />
  </div>
} @else {
  <app-page-introuvable />
}
