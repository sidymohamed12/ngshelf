@if (etat() !== 'pret') {
  <svg [appIcone]="icone()" class="ngs-vignette__icone"></svg>
}
@if (actif()) {
  <div
    class="ngs-vignette__cadre"
    [style.width.px]="dimensions().largeur"
    [style.height.px]="dimensions().hauteur"
    [style.top.px]="decalageHaut()"
    [style.transform]="'scale(' + dimensions().echelle + ')'"
  >
    <iframe
      #cadre
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
      allow=""
      tabindex="-1"
      [title]="titreIframe()"
    ></iframe>
  </div>
}
@if (interactif() && etat() === 'pret') {
  <div class="ngs-vignette__outils">
    <button
      #declencheur
      class="ngs-vignette__manip"
      type="button"
      [attr.aria-pressed]="manipule()"
      [attr.aria-label]="nomBouton()"
      (click)="manipuler()"
    >
      <svg appIcone="cursor-click" taille="sm"></svg>
      <span>{{ textes.manipuler }}</span>
    </button>
    @if (manipule()) {
      <span class="ngs-vignette__indice" aria-hidden="true">{{ textes.quitter }}</span>
    }
  </div>
  <span class="sr-only" role="status">{{ annonce() }}</span>
}
