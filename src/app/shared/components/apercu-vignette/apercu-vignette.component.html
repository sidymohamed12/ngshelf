@if (etat() !== 'pret') {
  <svg [appIcone]="icone()" class="ngs-vignette__icone"></svg>
}
@if (actif()) {
  <div
    class="ngs-vignette__cadre"
    [style.width.px]="dimensions().largeur"
    [style.height.px]="dimensions().hauteur"
    [style.transform]="'scale(' + dimensions().echelle + ')'"
  >
    <iframe
      #cadre
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
      allow=""
      tabindex="-1"
      [title]="titreIframe()"
    ></iframe>
  </div>
}
