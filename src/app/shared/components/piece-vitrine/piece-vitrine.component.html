<div class="ngs-piece__scene" aria-hidden="true" [style.aspect-ratio]="ratio()">
  @defer (on viewport) {
    <app-apercu-vignette
      [slug]="piece().slug"
      [titre]="libelle()"
      [icone]="icone()"
      [design]="design()"
      [reglages]="reglages()"
    />
  } @placeholder {
    <svg [appIcone]="icone()" class="ngs-piece__icone"></svg>
  }
</div>
@if (etiquette()) {
  <a
    class="ngs-etiquette"
    [class.ngs-etiquette--droite]="coin() === 'droite'"
    [routerLink]="chemin()"
  >
    {{ libelle() }}
  </a>
}
